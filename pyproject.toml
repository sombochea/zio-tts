[project]
name = "zio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sombochea100@gmail.com", email = "sombochea100@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "khmer-nltk>=1.6",
    "numpy>=2.5.4",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[project.optional-dependencies]
stt = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "jiwer>=4.0.0",
    "peft>=0.21.2",
    "torch>=2.14.1",
    "transformers>=5.20.0",
]
tts = [
    "coqui-tts[codec]>=0.27.5",
    "torchaudio>=2.11.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
