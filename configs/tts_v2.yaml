# v2: the open Khmer data in sombochea/zio-tts-data, initialised from v1 (launch with --ckpt).
# ~40 h: SLR42 (2.9 h, 16 male), seanghay (7.8 h), DDD (30 h, 6 speakers, female + male).
# Voices: km_* (SLR42, same ids as v1), seanghay, ddd_<speaker>.
data:
  - data/processed/slr42_km_male
  - data/processed/seanghay_km
  - data/processed/ddd_km
run: zio_tts_v2
out: outputs/tts_v2
voices: true
batch: 32
epochs: 300
workers: 4
fp16: false
save_step: 2500
keep_ckpts: 3
test_sentences:
  - ["សួស្តី តើ អ្នក សុខសប្បាយ ជា ទេ"]
