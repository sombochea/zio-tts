# v2: the open Khmer data in sombochea/zio-tts-data, initialised from v1 (launch with --ckpt).
# Voices: km_* (SLR42, same ids as v1), seanghay, ddd_<speaker>. Add ddd_km (~30 h, male + female) once it is uploaded.
data:
  - data/processed/slr42_km_male
  - data/processed/seanghay_km
run: zio_tts_v2
out: outputs/tts_v2
voices: true
batch: 32
epochs: 300
workers: 4
fp16: false
save_step: 2500
keep_ckpts: 3
test_sentences:
  - ["សួស្តី តើ អ្នក សុខសប្បាយ ជា ទេ"]
