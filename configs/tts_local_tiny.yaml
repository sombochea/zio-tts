# Tiny-RAM profile (8 GB machines): batch 2, clips <= 4 s.
# Fine as a pipeline check or a first listenable model on one speaker; real quality needs Modal.
data: data/processed/slr42_km_male
run: tts_local_tiny
out: outputs/tts_local_tiny
speakers: [km_6753]
batch: 2
max_audio_s: 4
epochs: 50
workers: 0
eval_size: 10
save_step: 1000
keep_ckpts: 1   # each checkpoint is ~1 GB; keep disk use ~3 GB
test_sentences:
  - ["សួស្តី តើ អ្នក សុខសប្បាយ ជា ទេ"]
